<article class="flex flex-col overflow-hidden rounded-xl border border-primary bg-white shadow-sm sm:flex-row">
  <div class="relative aspect-square w-full shrink-0 sm:w-48">
    @if (image()) {
      <img
        [ngSrc]="image()"
        [alt]="imageAlt() || title()"
        fill
        class="object-cover"
      />
    } @else {
      <div
        class="flex h-full items-center justify-center bg-primary/10 text-4xl font-semibold text-primary"
        aria-hidden="true"
      >
        {{ title().slice(0, 1).toUpperCase() }}
      </div>
    }
  </div>

  <div class="flex min-w-0 flex-col justify-center gap-2 p-5">
    <h2 class="w-fit rounded-md bg-primary px-3 py-1 text-xl font-semibold text-primary-foreground">
      {{ title() }}
    </h2>
    <p class="text-slate-700">{{ description() }}</p>
  </div>
</article>
