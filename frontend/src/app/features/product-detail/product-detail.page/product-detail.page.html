<app-header />

<main class="max-w-7xl w-full mx-auto px-6 md:px-8 py-4 flex-1">
  @if (state().status === 'loading') {
    <p class="py-12 text-center text-body-lg" role="status">Caricamento prodotto...</p>
  } @else if (state().status === 'not-found') {
    <p class="py-12 text-center text-body-lg" role="alert">Prodotto non trovato.</p>
  } @else if (state().status === 'error') {
    <p class="py-12 text-center text-body-lg" role="alert">Impossibile caricare il prodotto. Riprova più tardi.</p>
  } @else if (product(); as product) {
    <app-breadcrumb [productName]="product.title" [category]="product.categoryLabel" />

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      <div class="lg:col-span-5">
        <app-product-gallery [mainImage]="product.imageUrl" [imageAlt]="product.title" />
        <!-- [thumbnails]="product.thumbnails || []" and favorite controls are unavailable in ProductResponse. -->
      </div>

      <div class="lg:col-span-7 flex flex-col gap-6">
        <app-product-info
          [title]="product.title"
          [price]="product.price"
          [description]="product.description"
          [quantity]="quantity()"
          (quantityChange)="handleQuantityChange($event)" />
        <!-- Rating, review count, alcoholic details, and customizations are not in ProductResponse. -->
        <!-- <app-customization-options [selectedOptions]="customizations()" (optionChanged)="handleOptionChange($event)" /> -->

        <app-ingredient-list
          [ingredients]="product.ingredients"
          [allergens]="product.allergens" />

        <button
          type="button"
          class="w-full rounded-full border border-[#272728] bg-primary-container px-5 py-3 font-bold text-surface-container"
          (click)="addToCart(product)">
          Aggiungi al carrello · {{ (product.price * quantity()).toFixed(2) }} €
        </button>
      </div>
    </div>
  }
