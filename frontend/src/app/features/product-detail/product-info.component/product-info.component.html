<div class="rounded-xl bg-[#FFFFFF] p-6 border-[1.5px] border-[#272728] shadow-[0px_4px_0px_#272728]">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
    <span class="text-label-md px-3 py-1 bg-[#C8E7D9] text-[#4D685E] rounded-full font-bold inline-flex items-center gap-1.5 border border-[#486459]/30">
      <span class="material-symbols-outlined text-[16px]">local_cafe</span>
      Coffee bar ADM Reserve Item
    </span>
    <!-- Review -->
    <!-- <div class="flex items-center gap-1.5 text-label-md font-bold text-[#121313] bg-[#FAEDCD] px-3 py-1 rounded-full border border-[#121313]/15">
      <span class="material-symbols-filled text-[#E76F51] text-[18px]">star</span>
      <strong class="font-bold">{{ rating() }}</strong>
      <span class="text-[#45474A]">({{ reviewCount() }} reviews)</span>
    </div> -->
  </div>

  <h1 class="text-headline-xl lg:text-display-lg font-extrabold text-[#121313] tracking-tight mb-2">{{ title() }}</h1>

  <div class="flex items-center justify-between py-2 border-b border-[#121313]/10">
    <div class="flex items-baseline gap-2">
      <span class="text-headline-xl font-extrabold text-[#121313]">${{ price().toFixed(2) }}</span>
      <span class="text-body-sm text-[#45474A]">/ 12 oz standard</span>
    </div>
    
    <!-- Stepper Quantità -->
    <div class="flex items-center bg-[#FAEDCD] rounded-full border-[1.5px] border-[#272728] p-1 shadow-sm">
      <button (click)="quantityChange.emit(-1)" class="w-8 h-8 rounded-full bg-[#FFF8F0] flex items-center justify-center text-[#121313] font-bold hover:bg-white active:scale-95 transition-all">
        <span class="material-symbols-outlined text-[18px]">remove</span>
      </button>
      <span class="w-9 text-center font-bold text-label-lg text-[#121313]">{{ quantity() }}</span>
      <button (click)="quantityChange.emit(1)" class="w-8 h-8 rounded-full bg-[#FFF8F0] flex items-center justify-center text-[#121313] font-bold hover:bg-white active:scale-95 transition-all">
        <span class="material-symbols-outlined text-[18px]">add</span>
      </button>
    </div>
  </div>

  <p class="text-body-md text-[#45474A] mt-4 leading-relaxed">{{ description() }}</p>
