<!-- src/app/features/storefront/components/filter-bar/filter-bar.component.html -->
<section class="space-y-6 pb-8" id="catalog">
  <div class="flex flex-wrap items-center gap-3 pt-10 pb-2">
    @for (cat of categories(); track cat.id) {
    <button (click)="categoryChange.emit(cat.id)"
      [class]="activeCategory() === cat.id ? 'bg-primary text-white shadow-[0px_3px_0px_#272728]' : 'bg-surface text-primary'"
      class="px-5 py-2.5 rounded-full border border-[#272728] font-bold text-label-lg active:translate-y-0.5 transition-colors flex items-center gap-2">
      <span class="material-symbols-outlined text-[18px]">{{ cat.icon }}</span>
      <span>{{ cat.label }}</span>
      <span class="bg-surface text-primary text-label-sm px-2 py-0.5 rounded-full border border-[#272728] ml-1">{{
        cat.count }}</span>
    </button>
    }
  </div>

  <!-- Search Bar -->
  <div class="bg-surface-container-high rounded-xl border border-[#272728] p-4 flex flex-col md:flex-row items-center justify-between gap-4">
    <div class="relative flex-1 max-w-md w-full">
      <span
        class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
      <input (input)="onSearch($event)" type="text" placeholder="Search craft coffee, bakes, sandwiches..."
        class="w-full pl-10 pr-4 py-2 bg-surface border border-[#272728] rounded-full text-body-md focus:outline-none" />
    </div>
    
    <!-- <div class="flex items-center gap-3">
      <label class="cursor-pointer inline-flex items-center gap-2 bg-surface px-3 py-1.5 rounded-full border border-[#272728] select-none">
        <input type="checkbox" (change)="nonAlcoholicToggle.emit($any($event.target).checked)" class="rounded text-secondary border-[#272728]" />
        <span class="text-label-md font-bold text-primary">Non-Alcoholic only</span>
      </label>
    </div> -->
  </div>
</section>
