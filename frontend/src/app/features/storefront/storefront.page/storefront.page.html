<!-- src/app/features/storefront/pages/storefront-page/storefront-page.component.html -->
<app-header />

<main class="w-full max-w-7xl mx-auto px-6 md:px-8 py-8 space-y-12">
  <app-hero-banner 
    [featuredProduct]="allProducts()[0]" 
    (orderFeatured)="onAddToCart($event)" />

  <app-filter-bar 
    [categories]="categories()" 
    [activeCategory]="selectedCategory()"
    (categoryChange)="selectedCategory.set($event)"
    (searchChange)="searchQuery.set($event)" />
    <!-- (nonAlcoholicToggle)="nonAlcoholicOnly.set($event)"  -->

  <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    @for (product of filteredProducts(); track product.id) {
      <app-product-card 
        [product]="product" 
        (addToCart)="onAddToCart($event)"
        (viewDetails)="onViewDetails($event)" />
    } @empty {
      <div class="col-span-full text-center py-12">
        <p class="text-body-lg text-on-surface-variant">No products found for selected filters.</p>
      </div>
    }
  </section>
</main>

<app-footer />
<app-cart-tray />
