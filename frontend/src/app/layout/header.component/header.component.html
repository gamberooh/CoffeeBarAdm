<header class="sticky top-0 z-40 bg-surface border-b border-primary/10 shadow-[0px_4px_0px_#272728]">
  <div class="flex justify-between items-center w-full px-6 md:px-8 max-w-7xl mx-auto py-3">
    <a href="#" class="flex items-center gap-3">
      @if (logoUrl()) {
        <img [src]="logoUrl()" [alt]="brandName()" class="h-11 w-auto object-contain" />
      }
      <div class="hidden sm:flex flex-col">
        <span class="text-headline-md font-bold text-primary tracking-tight">{{ brandName() }}</span>
        <span class="text-label-sm text-secondary tracking-wider uppercase">Artisanal Roastery</span>
      </div>
    </a>

    <nav class="hidden md:flex items-center space-x-6">
      <a href="#catalog" class="text-primary border-b-2 border-primary font-bold text-label-lg">All</a>
      <a href="#catalog" class="text-on-surface-variant font-medium hover:text-primary transition-colors text-label-lg">Beverages</a>
      <a href="#catalog" class="text-on-surface-variant font-medium hover:text-primary transition-colors text-label-lg">Cakes & Pastries</a>
      <a href="#catalog" class="text-on-surface-variant font-medium hover:text-primary transition-colors text-label-lg">Cookies</a>
    </nav>

    <div class="flex items-center gap-3">
      <button (click)="cartService.toggleTray()" class="flex items-center gap-2.5 px-4 py-2 bg-primary-container text-surface-container rounded-full border-[1.5px] border-primary shadow-[0px_3px_0px_#272728] active:translate-y-0.5 transition-all">
        <span class="material-symbols-outlined text-[20px]">shopping_bag</span>
        <span class="text-label-lg font-bold">Cart ({{ cartService.summary().itemCount }})</span>
        <span class="bg-[#E76F51] text-white text-label-sm px-2 py-0.5 rounded-full border border-primary">
          ${{ cartService.summary().total.toFixed(2) }}
        </span>
      </button>
    </div>
  </div>
</header>
